appId: com.cyjoon.chattea
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Connect"
    timeout: 30000
- openLink: "chattea://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8082"
- extendedWaitUntil:
    visible: "Continue"
    timeout: 120000
- tapOn: "Continue"
- runFlow:
    when:
      visible: "Fast refresh"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible: "매칭"
    timeout: 120000
- openLink: "chattea://settings"
- extendedWaitUntil:
    visible: "로그아웃"
    timeout: 30000
- assertVisible: "새 매치 알림"
- assertVisible: "구독 관리"
- takeScreenshot: 04-settings
- tapOn: "로그아웃"
- extendedWaitUntil:
    visible: "카카오로 시작"
    timeout: 30000
- takeScreenshot: 04-login-after-logout
