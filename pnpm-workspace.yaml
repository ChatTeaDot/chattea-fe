packages:
  - "apps/*"

allowBuilds:
  "@datadog/mobile-react-native": true
  "@sentry/cli": true
  esbuild: true
  return-fetch: true
  unrs-resolver: true
auditConfig:
  ignoreGhsas:
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq

overrides:
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=3.0.0 <5.0.9": 5.0.9
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  "nanoid@<3.3.18": 3.3.18
  "postcss@<=8.5.22": 8.5.23
  "shell-quote@<=1.8.4": 1.10.0
